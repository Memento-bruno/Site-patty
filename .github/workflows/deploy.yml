name: Publicar o site

on:
  push:
    branches: [main]
  # Permite publicar na mão pela aba "Actions" do GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se duas forem disparadas juntas, a mais nova espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Devolve o endereço real do site e o caminho base já configurados no
      # GitHub Pages. Vindo daqui, continuam certos se o repositório for
      # renomeado ou passar a usar domínio próprio.
      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # O build avisa, no fim, quantos [[CONFIRMAR]] ainda aparecem no site.
      - name: Construir o site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Trava a publicação se algo proibido pelo Código de Ética voltar ao site.
      - name: Conferir as regras do CFP
        run: npm run etica

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
